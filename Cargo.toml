[package]
name = "pam-any"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pam-bindings = { version = "0.2.1", package = "pam-bindings" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
pam-client2 = { version = "0.5.5", default-features = false }
rustix = { version = "1.1", features = ["event", "net", "termios"] }
